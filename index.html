<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Games</title>
  <style>
    :root { color-scheme: light dark; --bg: #f7f5f2; --fg: #222; --card: #fff; --line: #ddd; --accent: #6b4c8a; }
    @media (prefers-color-scheme: dark) { :root { --bg: #18161b; --fg: #eee; --card: #232027; --line: #3a3640; --accent: #c3a6e0; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif; line-height: 1.6; }
    main { max-width: 720px; margin: 0 auto; padding: 48px 16px; }
    h1 { font-size: 1.6rem; margin: 0 0 24px; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
    a.card { display: block; padding: 16px 20px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; color: inherit; text-decoration: none; }
    a.card:hover { border-color: var(--accent); }
    .title { font-weight: 600; color: var(--accent); }
    .desc { font-size: 0.9rem; opacity: 0.8; }
  </style>
</head>
<body>
  <main>
    <h1>Games</h1>
    <ul>
      <!-- ゲームを追加するときは games/<名前>/ に置いて、ここに <li> を1つ足してください -->
      <li>
        <a class="card" href="./games/watashi-no-ningyo/">
          <div class="title">わたしの人魚</div>
          <div class="desc">ノベルゲーム（TyranoScript）</div>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
